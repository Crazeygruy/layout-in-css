<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Layout 5</title>
    <link rel="stylesheet" href="../style.css">
    <style>
      body{
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2em;
        padding: 15px;
        grid-template-areas:
       "       header header"
       "nav nav"
       "        main main"
       "        footer footer"
        ;
      }

      header{
        grid-area: header;
        grid-area: 1/4;
        width: 1000px;
        margin-right: 15px;
      }

      nav{
        grid-area: nav;
        width: 800px;
        margin-left: 20px;
      }

      main{
        grid-area: main;
        grid-area: 3/4;
        margin-right: 15px;
      }

      footer{
        grid-area: footer;
        grid-area: 4/4;
        margin-right: 15px;
      }
      /* Doe hier jouw ding! */
    </style>
  </head>
  <body id="basic-layout-5">
    <header><h1>Basic Layout 5</h1></header>
    <nav><a href="../index.html">Terug naar het overzicht</a></nav>
    <main></main>
    <footer></footer>
  </body>
</html>
