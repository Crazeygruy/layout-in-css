<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Layout 9</title>
    <link rel="stylesheet" href="../style.css">
    <style>
      body{
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(5, 1fr);
        gap: 1em;
        grid-template-areas: 
        "header nav nav"
        "main main main"
        "main main main"
        "main main main"
        "footer footer footer"
        ;
      }
      header{
        grid-area: header;
      }
      nav{
        display: flex;
        grid-area: nav;
        gap: 1em;
        justify-content: center;
        align-items: center;
        font-size: 50px;

      }
      main{
        grid-area: main;
      }
      footer{
        grid-area: footer;
      }
      a{
        border: 50px white;
        background-color: white;
        border-radius: 5%;
        text-decoration: none;
      }
    </style>
  </head>
  <body id="basic-layout-9">
    <header><h1>Basic Layout 9</h1></header>
    <nav>
      <a href="#">Home</a>
      <a href="#">Over ons</a>
      <a href="#">Contact</a>
    </nav>
    <main><a href="../index.html">Terug naar het overzicht</a></main>
    <footer></footer>
  </body>
</html>
